services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      # qdrant/qdrant:latest has no curl/wget/python (confirmed by
      # inspecting the image's /bin), so we speak raw HTTP over bash's
      # /dev/tcp instead -- confirmed working against a running
      # qdrant/qdrant:latest container (both the success and
      # connection-refused paths return the expected exit codes).
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && timeout 2 cat <&3 | grep -q 200'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7
    volumes:
      - ./data/redis:/data
    restart: unless-stopped

  mineru:
    build:
      context: .
      dockerfile: Dockerfile.mineru
    command: mineru-api --host 0.0.0.0 --port 8000
    ports:
      - "8100:8000"
    environment:
      # Same HuggingFace cache bind-mount as api/worker, so MinerU's
      # pipeline-backend models are picked up from the host cache instead
      # of re-downloading inside the container.
      HF_HOME: /hf_cache
      # HF_HOME only sets the cache location -- from_pretrained() still
      # does a network etag check against huggingface.co on every startup
      # unless offline mode is forced, even with a fully populated cache.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ${HOME}/.cache/huggingface:/hf_cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    # --workers: each worker is a separate process with its own GIL, its own
    # @lru_cache model singletons and its own inference locks. A single
    # process is capped at ~65 RPS on /search/text with rerank off -- not by
    # GPU or by the embed lock (both measured flat/idle), but by GIL convoy:
    # torch releases the GIL during GPU work, other threads grab it to
    # serialize 16.8KB JSON responses, and the lock-holding thread then waits
    # out sys.setswitchinterval to resume, stretching the critical section
    # itself. See docs/concurrency-benchmark.md 结果七 and
    # docs/superpowers/specs/2026-08-29-api-worker-processes-design.md.
    # uvicorn 0.32.1 spawns (not forks) workers -- verified in the installed
    # uvicorn/_subprocess.py:17 `multiprocessing.get_context("spawn")` -- so
    # there is no CUDA-after-fork hazard of the kind app/worker.py avoids.
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-4}
    ports:
      - "18000:8000"
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /srv/data
      MINERU_API_URL: http://mineru:8000
      # Bind-mounted straight to this host's real HuggingFace cache
      # (~/.cache/huggingface) instead of an empty project-local dir, so
      # BGE-M3/Chinese-CLIP -- already downloaded there from earlier
      # bare-metal GPU testing on this machine -- are picked up immediately
      # instead of re-downloading from scratch inside the container.
      HF_HOME: /hf_cache
      # HF_HOME only sets the cache location -- from_pretrained() still
      # does a network etag check against huggingface.co on every startup
      # unless offline mode is forced, even with a fully populated cache.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RERANKER_ENABLED: ${RERANKER_ENABLED:-false}
      # Consumed by the `command:` above, not by app/config.py. Each worker
      # holds a full model set (~1.8GB with rerank off), so this trades
      # memory for throughput; 4 was measured as the sweet spot on this
      # 20-core host.
      API_WORKERS: ${API_WORKERS:-1}
    volumes:
      - ./data:/srv/data
      - ${HOME}/.cache/huggingface:/hf_cache
    depends_on:
      - qdrant
      - redis
      - mineru
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      # /health only returns 200 once the lifespan hook in app/api/main.py
      # has finished loading all model singletons (Important Finding I1)
      # AND Qdrant/Redis both answer a live probe -- so restart: unless-stopped
      # alone won't mask "container up, models loaded, but Qdrant/Redis
      # unreachable" as healthy.
      # python3 (not curl -- confirmed absent from this python:3.12-slim
      # image via `docker run --rm <api-image> which curl`) is guaranteed
      # present since it's the base image's own interpreter. A non-200
      # response (e.g. 503 while still loading) raises HTTPError, which
      # exits non-zero same as a connection failure -- verified against
      # the built multimodal-retrieval-service-api image.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      # Model loading (BGE-M3 + Chinese-CLIP) can take real time, especially
      # on first run before weights are cached -- don't mark unhealthy while
      # legitimately still starting up.
      start_period: 120s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m app.worker
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /srv/data
      MINERU_API_URL: http://mineru:8000
      # Bind-mounted straight to this host's real HuggingFace cache
      # (~/.cache/huggingface) instead of an empty project-local dir, so
      # BGE-M3/Chinese-CLIP -- already downloaded there from earlier
      # bare-metal GPU testing on this machine -- are picked up immediately
      # instead of re-downloading from scratch inside the container.
      HF_HOME: /hf_cache
      # HF_HOME only sets the cache location -- from_pretrained() still
      # does a network etag check against huggingface.co on every startup
      # unless offline mode is forced, even with a fully populated cache.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/srv/data
      - ${HOME}/.cache/huggingface:/hf_cache
    depends_on:
      - qdrant
      - redis
      - mineru
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  admin-ui:
    build:
      context: .
      dockerfile: admin_ui/Dockerfile
    ports:
      - "27860:7860"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped
